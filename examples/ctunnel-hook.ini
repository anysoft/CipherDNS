# Install examples/hooks/ctunnel-update.sh and prepare its managed block first.
# See docs/ctunnel-hook.md. The optional example requires Bash, jq, flock and timeout.
[common]
mode = client
domain = home.example.com
key_file = /etc/cipherdns/aes.key

[client]
poll_interval = 60
dns_timeout = 5
prefer_family = ipv6
check_connectivity = false
check_port = 7000
check_timeout = 3
hook_on_recovery = false
hook = /etc/cipherdns/ctunnel-update.sh
hook_timeout = 45
hook_min_interval = 10
state_file = /var/lib/cipherdns/ctunnel-applied.state
current_file = /run/cipherdns/ctunnel-current.json
