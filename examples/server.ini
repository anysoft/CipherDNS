[common]
mode = server
domain = home.example.com
key_file = /etc/cipherdns/aes.key

[server]
ip_family = ipv6
ip_source = interface
interface = br0
check_interval = 30
port = 7000
ipv6_strategy = lowest
allow_ula = false
allow_private_ipv4 = false
command_timeout = 5

[dns]
provider = cloudflare
credentials_file = /etc/cipherdns/cloudflare.ini
ttl = 60
connect_timeout = 10
read_timeout = 10
update_timeout = 30
retries = 2
# Embedded devices: install a CA bundle, then set its absolute path.
# ca_file = /etc/ssl/certs/ca-certificates.crt
