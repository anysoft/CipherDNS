[common]
mode = server
domain = home.example.com
key_file = /etc/cipherdns/aes.key

[server]
ip_family = ipv6
ip_source = auto
check_interval = 30
port = 7000

[dns]
provider = aliyun
zone = example.com
rr = home
credentials_file = /etc/cipherdns/aliyun.ini
ttl = 600
connect_timeout = 10
read_timeout = 10
update_timeout = 30
retries = 2
