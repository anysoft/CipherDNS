name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  builds:
    uses: ./.github/workflows/build.yml
  publish:
    needs: builds
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify packages, reports and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          version=${GITHUB_REF_NAME#v}
          [[ $version =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]
          expected=(linux-x86_64-glibc-mostly-static macos-arm64 macos-x86_64 windows-x86_64 linux-x86_64-musl-static linux-i686-musl-static linux-arm64-musl-static linux-armv7-musl-static linux-armv5-musl-static linux-mips-musl-static linux-mipsel-musl-static)
          for target in "${expected[@]}"; do
            extension=tar.gz
            [[ $target != windows-* ]] || extension=zip
            test -s "dist/cipherdns-$version-$target.$extension"
            test -s "dist/cipherdns-$version-$target.$extension.sha256"
          done
          for target in linux-x86_64-glibc-mostly-static macos-arm64 macos-x86_64 windows-x86_64; do
            extension=tar.gz
            [[ $target != windows-* ]] || extension=zip
            test -s "dist/cipherdns-$version-$target-CLIENT.$extension"
          done
          test "$(find dist -maxdepth 1 -name '*.sha256' | wc -l)" -eq 15
          (cd dist && sha256sum -c -- *.sha256)
          python3 - <<'PY'
          import hashlib, pathlib, tarfile, zipfile
          summaries = []
          for archive in sorted(pathlib.Path('dist').glob('*')):
              if archive.name.endswith('.tar.gz'):
                  with tarfile.open(archive) as content:
                      files = {pathlib.PurePosixPath(m.name).name: content.extractfile(m).read() for m in content.getmembers() if m.isfile() and pathlib.PurePosixPath(m.name).name in ('cipherdns', 'link-report.txt')}
              elif archive.suffix == '.zip':
                  with zipfile.ZipFile(archive) as content:
                      files = {pathlib.PurePosixPath(n).name: content.read(n) for n in content.namelist() if pathlib.PurePosixPath(n).name in ('cipherdns.exe', 'link-report.txt')}
              else:
                  continue
              binary = files.get('cipherdns', files.get('cipherdns.exe'))
              report = files['link-report.txt'].decode()
              assert binary is not None and '\nverification: PASS\n' in report, archive
              assert 'sha256: ' + hashlib.sha256(binary).hexdigest() + '\n' in report, archive
              summaries.append('=== ' + archive.name + ' ===\n' + report)
          pathlib.Path('dist/BUILD-REPORTS.txt').write_text('\n'.join(summaries))
          PY
          git archive --format=tar.gz --prefix="cipherdns-$version/" -o "dist/cipherdns-$version-source.tar.gz" HEAD
          (cd dist && sha256sum -- *.tar.gz *.zip BUILD-REPORTS.txt > SHA256SUMS)
          cp docs/release-v0.2.0.md dist/RELEASE-NOTES.md
      - name: Publish verified artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "CipherDNS $GITHUB_REF_NAME" --notes-file dist/RELEASE-NOTES.md dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/BUILD-REPORTS.txt
