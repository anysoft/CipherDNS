name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  builds:
    uses: ./.github/workflows/build.yml
  publish:
    needs: builds
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
          skip-decompress: false
          digest-mismatch: error
      - name: Verify packages, reports and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          version=${GITHUB_REF_NAME#v}
          [[ $version =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]
          expected=(linux-x86_64-glibc-mostly-static macos-arm64 macos-x86_64 windows-x86_64 linux-x86_64-musl-static linux-i686-musl-static linux-arm64-musl-static linux-armv7-musl-static linux-armv5-musl-static linux-mips-musl-static linux-mipsel-musl-static)
          for target in "${expected[@]}"; do
            extension=tar.gz
            [[ $target != windows-* ]] || extension=zip
            test -s "dist/cipherdns-$version-$target.$extension"
            test -s "dist/cipherdns-$version-$target.$extension.sha256"
          done
          for target in linux-x86_64-glibc-mostly-static macos-arm64 macos-x86_64 windows-x86_64; do
            extension=tar.gz
            [[ $target != windows-* ]] || extension=zip
            test -s "dist/cipherdns-$version-$target-CLIENT.$extension"
          done
          test "$(find dist -maxdepth 1 -name '*.sha256' | wc -l)" -eq 15
          (cd dist && sha256sum -c -- *.sha256)
          python3 scripts/verify-release.py dist
          git archive --format=tar.gz --prefix="cipherdns-$version/" -o "dist/cipherdns-$version-source.tar.gz" HEAD
          (cd dist && sha256sum -- *.tar.gz *.zip BUILD-REPORTS.txt > SHA256SUMS)
          cp "docs/release-v$version.md" dist/RELEASE-NOTES.md
      - name: Publish verified artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "CipherDNS $GITHUB_REF_NAME" --notes-file dist/RELEASE-NOTES.md dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/BUILD-REPORTS.txt
